name: Phase9A V1 formatting publisher (temporary)
on:
  push:
    branches: [mvp-yellow-mellow-integration]
permissions:
  contents: write
jobs:
  format-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Format four V1 files and publish one commit
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/reelforge/characters/yellow_mellow/artwork.py
            src/reelforge/characters/yellow_mellow/environment.py
            src/reelforge/characters/yellow_mellow/poses.py
            src/reelforge/characters/yellow_mellow/rig.py
          )
          uv run --frozen ruff format "${files[@]}"
          uv run --frozen ruff check "${files[@]}"
          uv run --frozen ruff format --check "${files[@]}"
          git diff --check
          git add -- "${files[@]}"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Apply Ruff formatting to Yellow Mellow V1 four-file lint repair"
          git push origin HEAD:refs/heads/mvp-yellow-mellow-integration
