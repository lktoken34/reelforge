name: foundation-cairo-video
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m build --no-isolation
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          uv venv /tmp/reelforge-wheel
          uv pip install --python /tmp/reelforge-wheel/bin/python dist/reelforge_v2-*.whl
          cd /tmp
          /tmp/reelforge-wheel/bin/python -c 'from reelforge.resources.memory import observe_memory; d=observe_memory(); assert d["memory_policy"] == "strict"; print(d["memory_source"])'
          /tmp/reelforge-wheel/bin/reelforge capabilities
          /tmp/reelforge-wheel/bin/reelforge schema
          /tmp/reelforge-wheel/bin/reelforge validate "$GITHUB_WORKSPACE/examples/foundation/project.json"

  cairo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev build-essential ffmpeg
      - run: uv sync --frozen --extra renderer
      - name: Create workspace scratch parent
        run: mkdir -p outputs
      - run: uv run --frozen --extra renderer pytest --basetemp outputs/test-temp
      - run: uv run --frozen --extra renderer python tools/render_diagnostics.py --output-dir /tmp/reelforge-diagnostics
      - name: Five-second stream and decode smoke
        run: |
          mkdir -p outputs/ci-video
          uv run --frozen --extra renderer python tools/render_video.py --width 360 --output outputs/ci-video/demo.mp4 --report outputs/ci-video/demo.json

      - name: Strict memory probe and handled recovery
        run: |
          uv run --frozen --extra renderer python -S tools/memory_probe.py --report outputs/ci-memory.json
          uv run --frozen --extra renderer python tools/recovery_check.py --workspace "$GITHUB_WORKSPACE" --report outputs/ci-recovery.json
      - name: Build sealed prebuilt runtime bundle on roomy builder
        shell: bash
        run: |
          uv run --frozen --extra renderer python -m build --no-isolation
          uv export --frozen --extra renderer --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file outputs/runtime-pins.txt
          uv venv --seed outputs/wheel-builder
          mkdir -p outputs/wheelhouse outputs/build-tmp
          TMPDIR="$PWD/outputs/build-tmp" outputs/wheel-builder/bin/python -m pip wheel --no-deps --config-settings=setup-args=-Dno-x11=true --wheel-dir outputs/wheelhouse pycairo==1.29.2
          outputs/wheel-builder/bin/python -m pip wheel --only-binary=:all: --find-links outputs/wheelhouse --wheel-dir outputs/wheelhouse -r outputs/runtime-pins.txt
          cp dist/reelforge_v2-*.whl outputs/wheelhouse/
          uv run --frozen --extra renderer python tools/wheelhouse.py seal --directory outputs/wheelhouse --source-commit "$GITHUB_SHA"
      - name: Verify fresh offline runtime without compilation
        shell: bash
        run: |
          uv run --frozen --extra renderer python tools/wheelhouse.py install --directory outputs/wheelhouse --venv outputs/offline-proof
          outputs/offline-proof/bin/python tools/deployment_check.py --workspace "$GITHUB_WORKSPACE" --report outputs/offline-readiness.json
          outputs/offline-proof/bin/python tools/render_video.py --width 360 --frames 450 --output outputs/offline-proof-video/demo.mp4 --report outputs/offline-proof-video/demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: reelforge-v2-phase2c1-py312-ubuntu24-x86_64-wheelhouse
          path: outputs/wheelhouse/
          retention-days: 30
          if-no-files-found: error

      - name: Phase 3A.1 development character quality proofs
        run: |
          uv run --frozen --extra renderer python tools/validate_character.py examples/characters/rowan_walk.json
          uv run --frozen --extra renderer python tools/render_character.py --output-dir outputs/ci-character --stills-only
          uv run --frozen --extra renderer python tools/render_character.py --output-dir outputs/ci-character
          uv run --frozen --extra renderer python tools/review_character_polish.py --output-dir outputs/ci-polish-review --after outputs/ci-character/rowan_idle_walk_run.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: phase3a1-character-visual-review
          path: |
            outputs/ci-character/
            outputs/ci-polish-review/
          retention-days: 30
          if-no-files-found: error

      - name: Phase 3B development environment quality proofs
        run: |
          uv run --frozen --extra renderer python tools/validate_environment.py examples/environments/orchard_push.json
          uv run --frozen --extra renderer python tools/render_environment.py --output-dir outputs/ci-environment --stills-only
          uv run --frozen --extra renderer python tools/render_environment.py --output-dir outputs/ci-environment
          uv run --frozen --extra renderer python tools/environment_review.py --output-dir outputs/ci-environment --repeat-dir outputs/ci-environment-repeat
      - uses: actions/upload-artifact@v4
        with:
          name: phase3b-environment-visual-review
          path: outputs/ci-environment/
          retention-days: 30
          if-no-files-found: error
