[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reelforge-v2"
version = "0.4.1"
description = "Agent contracts and bounded CPU vector-to-video feasibility"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
renderer = ["pycairo==1.29.2"]

[project.scripts]
reelforge = "reelforge.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "build==1.3.0", "hatchling==1.27.0"]

[tool.uv]
config-settings-package = { pycairo = { setup-args = "-Dno-x11=true" } }

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
