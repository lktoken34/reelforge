[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reelforge-v2"
version = "0.1.0"
description = "Phase 1 contracts and repository foundation for a CPU animation engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
reelforge = "reelforge.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "build==1.3.0", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
